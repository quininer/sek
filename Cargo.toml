[package]
name = "sek"
version = "0.1.0"
authors = ["quininer <quininer@live.com>"]
edition = "2018"

[[bin]]
name = "seksh"
path = "src/main.rs"

[dependencies]
# utils
anyhow = "1"
log = "0.4"
time = { version = "0.2", features = [ "serde" ] }
bstr = { version = "0.2", features = [ "serde1" ] }
serde = { version = "1", features = [ "derive" ] }
scopeguard = "1"
if_chain = "1"
bumpalo = { version = "3", features = [ "collections", "boxed" ] }
siphasher = "0.3"

# runtime
tokio = { version = "1", features = [ "rt", "signal", "process", "io-util", "macros", "parking_lot" ] }
tokio-stream = "0.1"

# term
crossterm = { version = "0.19", features = [ "event-stream" ] }

# options
argh = "0.1"
directories = "3"

# editor
unicode-width = "0.1"

# shell parse
logos = "0.12"

# process
libc = "0.2"

# config
serde_json = "1"
serde-tuple-vec-map = "1"

# highlight
xorf = "0.7"

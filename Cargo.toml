[package]
name = "sek"
version = "0.1.0"
authors = ["quininer <quininer@live.com>"]
edition = "2024"

[[bin]]
name = "seksh"
path = "src/main.rs"

[workspace]
members = [ "protocol" ]
exclude = [ "scripts" ]

[dependencies]
sek-protocol = { path = "protocol" }

# utils
anyhow = "1"
smallvec = "1"
bstr = { version = "1", default-features = false, features = [ "std" ] }
pin-project-lite = "0.2"
memchr = { version = "2", default-features = false }
futures-core = { version = "0.3", default-features = false }

# options
argh = "0.1"
directories = "6"
serde = { version = "1", features = [ "derive" ] }
serde_bytes = { version = "0.11", default-features = false }
serde_json = "1"
serde-tuple-vec-map = "1"

# ui
crossterm = { version = "0.29", default-features = false, features = [ "events", "event-stream" ] }
unicode-width = "0.2"
annotate-snippets = "0.12"

# lang
logos = "0.16"

# editor
glob = "0.3"
icu_segmenter = "2"
icu_collator = "2"

# command execute
tokio = { version = "1", features = [
  "rt", "io-util", "sync",
  "signal", "process", "net",
] }

# executable file
fst = "0.4"

# prompt
anstream = { version = "1", default-features = false }

# daemon
cbor4ii = { version = "1", features = [ "serde1", "use_std" ] }
jiff = { version = "0.2", default-features = false, features = [ "std", "serde" ] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = [ "windows" ] }

[target.'cfg(unix)'.dev-dependencies]
completest-pty = "1.1.0"
ptyprocess = "0.5.0"
vt100 = "0.16.2"

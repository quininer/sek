[package]
name = "sek"
version = "0.1.0"
authors = ["quininer <quininer@live.com>"]
edition = "2024"

[[bin]]
name = "seksh"
path = "src/main.rs"

[dependencies]
# utils
anyhow = "1"
smallvec = "1"
bstr = "1"
pin-project-lite = "0.2"

# options
argh = "0.1"
directories = "6"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde-tuple-vec-map = "1"

# ui
crossterm = { version = "0.29", default-features = false, features = [ "events" ] }
unicode-width = "0.2"
annotate-snippets = "0.12"

# lang
logos = "0.16"

# editor
glob = "0.3"
icu_segmenter = "2"
icu_collator = "2"

# command
tokio = { version = "1", features = [
  "rt", "io-util", "sync",
  "signal", "process", "net"
] }

# daemon
cbor4ii = { version = "1", features = [ "serde1", "use_std" ] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = [ "windows" ] }
